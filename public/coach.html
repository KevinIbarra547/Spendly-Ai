<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — AI Coach</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen flex" style="background:var(--bg-base);color:var(--fg1)">

  <div id="sidebar-container"></div>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-zinc-950">
    <main class="flex flex-col items-center px-4 pt-10 pb-8 min-h-screen">

      <!-- Auth banner (hidden by default, shown by coach.js if not logged in) -->
      <div id="auth-banner" style="display:none"
           class="w-full max-w-2xl mb-4 bg-yellow-900 border border-yellow-700 rounded-lg px-4 py-3 text-sm text-yellow-200">
        You must <a href="/" class="underline font-semibold">log in</a> to use the Coach.
      </div>

      <!-- Chat card -->
      <div class="w-full max-w-2xl bg-zinc-900 rounded-2xl shadow-md flex flex-col border border-zinc-800" style="height: 70vh; min-height: 420px;">

        <!-- Card header -->
        <div class="flex items-center justify-between px-5 py-4 border-b border-zinc-800">
          <div>
            <h1 class="text-lg font-bold text-white flex items-center gap-2">
              Spendly Coach
              <span class="w-2 h-2 rounded-full bg-green-500 flex-shrink-0"></span>
            </h1>
            <p class="text-xs text-zinc-400">Online · Knows your budget</p>
          </div>
          <button id="clear-btn"
                  class="text-xs text-zinc-400 hover:text-white underline">
            Clear chat
          </button>
        </div>

        <!-- Message thread -->
        <div id="message-thread"
             class="flex-1 overflow-y-auto px-4 py-4 flex flex-col">
        </div>

        <!-- Suggestion chips (hidden once conversation starts) -->
        <div id="suggestion-chips" class="flex flex-wrap gap-2 px-4 pb-2">
          <button class="suggestion-chip bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-medium px-3 py-1.5 rounded-full border border-zinc-700 transition-colors"
                  data-prompt="Give me tips to save money this month">
            💡 Save tips
          </button>
          <button class="suggestion-chip bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-medium px-3 py-1.5 rounded-full border border-zinc-700 transition-colors"
                  data-prompt="Where is most of my money going right now?">
            📊 Where did my $ go?
          </button>
          <button class="suggestion-chip bg-zinc-800 hover:bg-zinc-700 text-zinc-300 text-xs font-medium px-3 py-1.5 rounded-full border border-zinc-700 transition-colors"
                  data-prompt="How am I doing on my savings goals?">
            🎯 Goal advice
          </button>
        </div>

        <!-- Input row -->
        <div class="px-4 py-3 border-t border-zinc-700 bg-zinc-800 flex items-end gap-2">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Ask your Coach anything…"
            class="flex-1 resize-none rounded-xl border border-zinc-700 bg-zinc-800 px-4 py-2 text-sm text-white placeholder-zinc-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 overflow-hidden"
            style="max-height: 120px;"
          ></textarea>
          <button
            id="send-btn"
            class="flex-shrink-0 bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 text-white text-sm font-semibold rounded-xl px-4 py-2 transition-colors"
          >
            Send
          </button>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/coach.js"></script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
