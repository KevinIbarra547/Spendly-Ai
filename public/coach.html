<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — AI Coach</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- ============ DEV PREVIEW BANNER — REMOVE BEFORE DEMO ============ -->
  <div id="dev-banner" class="fixed top-2 right-2 z-50 bg-white border border-slate-300 rounded-lg shadow-lg px-3 py-2 text-xs font-mono flex items-center gap-2">
    <span id="tw-dot" class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
    <span class="text-slate-700">coach.html</span>
    <span class="text-slate-400">|</span>
    <span id="boot-time" class="text-slate-500">…</span>
    <button id="ping-btn" class="ml-1 px-2 py-0.5 rounded bg-slate-900 text-white hover:bg-slate-700">ping</button>
    <span id="ping-result" class="text-slate-500">·</span>
  </div>
  <!-- ============ END DEV PREVIEW BANNER ============ -->

  <main class="flex flex-col items-center px-4 pt-16 pb-8 min-h-screen">

    <!-- Auth banner (hidden by default, shown by coach.js if not logged in) -->
    <div id="auth-banner" style="display:none"
         class="w-full max-w-2xl mb-4 bg-yellow-50 border border-yellow-300 rounded-lg px-4 py-3 text-sm text-yellow-800">
      You must <a href="/" class="underline font-semibold">log in</a> to use the Coach.
    </div>

    <!-- Chat card -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-md flex flex-col" style="height: 70vh; min-height: 420px;">

      <!-- Card header -->
      <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
        <div>
          <h1 class="text-lg font-bold text-slate-900">Spendly Coach</h1>
          <p class="text-xs text-slate-500">Your money's smarter friend</p>
        </div>
        <button id="clear-btn"
                class="text-xs text-slate-400 hover:text-slate-600 underline">
          Clear chat
        </button>
      </div>

      <!-- Message thread -->
      <div id="message-thread"
           class="flex-1 overflow-y-auto px-4 py-4 flex flex-col">
      </div>

      <!-- Input row -->
      <div class="px-4 py-3 border-t border-slate-100 flex items-end gap-2">
        <textarea
          id="chat-input"
          rows="1"
          placeholder="Ask your Coach anything…"
          class="flex-1 resize-none rounded-xl border border-slate-200 bg-slate-50 px-4 py-2 text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-400 overflow-hidden"
          style="max-height: 120px;"
        ></textarea>
        <button
          id="send-btn"
          class="flex-shrink-0 bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 text-white text-sm font-semibold rounded-xl px-4 py-2 transition-colors"
        >
          Send
        </button>
      </div>

    </div>
  </main>

  <script src="/js/coach.js"></script>

  <script>
    (async () => {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        document.getElementById('boot-time').textContent = 'boot ' + new Date(data.startedAt).toLocaleTimeString();
      } catch (e) {
        document.getElementById('boot-time').textContent = 'boot ?';
      }
      document.getElementById('ping-btn').addEventListener('click', async () => {
        const el = document.getElementById('ping-result');
        el.textContent = '…';
        try {
          const r = await fetch('/api/health');
          el.textContent = r.ok ? '✅' : '❌';
        } catch {
          el.textContent = '❌';
        }
      });
    })();
  </script>
</body>
</html>
