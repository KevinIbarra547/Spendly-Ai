<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — AI Coach</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    /* Recolor coach.js-generated assistant bubbles for the dark theme */
    #message-thread .bg-slate-100 { background-color: #1e293b; color: #f1f5f9; }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex">

  <div id="sidebar-container"></div>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-slate-950">
    <main class="flex flex-col items-center px-4 pt-10 pb-8 min-h-screen">

      <!-- Auth banner (hidden by default, shown by coach.js if not logged in) -->
      <div id="auth-banner" style="display:none"
           class="w-full max-w-2xl mb-4 bg-yellow-900 border border-yellow-700 rounded-lg px-4 py-3 text-sm text-yellow-200">
        You must <a href="/" class="underline font-semibold">log in</a> to use the Coach.
      </div>

      <!-- Chat card -->
      <div class="w-full max-w-2xl bg-slate-900 rounded-2xl shadow-md flex flex-col border border-slate-800" style="height: 70vh; min-height: 420px;">

        <!-- Card header -->
        <div class="flex items-center justify-between px-5 py-4 border-b border-slate-800">
          <div>
            <h1 class="text-lg font-bold text-white">Spendly Coach</h1>
            <p class="text-xs text-slate-400">Your money's smarter friend</p>
          </div>
          <button id="clear-btn"
                  class="text-xs text-slate-400 hover:text-white underline">
            Clear chat
          </button>
        </div>

        <!-- Message thread -->
        <div id="message-thread"
             class="flex-1 overflow-y-auto px-4 py-4 flex flex-col">
        </div>

        <!-- Input row -->
        <div class="px-4 py-3 border-t border-slate-800 flex items-end gap-2">
          <textarea
            id="chat-input"
            rows="1"
            placeholder="Ask your Coach anything…"
            class="flex-1 resize-none rounded-xl border border-slate-600 bg-slate-700 px-4 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-400 overflow-hidden"
            style="max-height: 120px;"
          ></textarea>
          <button
            id="send-btn"
            class="flex-shrink-0 bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 text-white text-sm font-semibold rounded-xl px-4 py-2 transition-colors"
          >
            Send
          </button>
        </div>

      </div>
    </main>
  </div>

  <script src="/js/coach.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/admin-nav.js"></script>
</body>
</html>
