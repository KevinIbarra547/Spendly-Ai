<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Receipt Scanner</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen flex" style="background:var(--bg-base);color:var(--fg1)">

  <div id="sidebar-container"></div>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-zinc-950">
    <main class="flex flex-col items-center px-4 pt-10 pb-8 min-h-screen">

      <!-- Auth banner (shown by scanner.js if not logged in) -->
      <div id="auth-banner" style="display:none"
           class="w-full max-w-2xl mb-4 bg-yellow-900 border border-yellow-700 rounded-lg px-4 py-3 text-sm text-yellow-200">
        You must <a href="/" class="underline font-semibold">log in</a> to use the Scanner.
      </div>

      <!-- Scanner card -->
      <div class="w-full max-w-2xl bg-zinc-900 rounded-2xl shadow-md px-6 py-8 border border-zinc-800">

        <!-- Card header -->
        <div class="mb-6">
          <h1 class="text-xl font-bold text-white">Spendly Receipt Scanner</h1>
          <p class="text-sm text-zinc-400 mt-1">Snap, scan, save. No typing.</p>
        </div>

        <!-- Drop zone -->
        <div id="drop-zone"
             class="flex flex-col items-center justify-center gap-3 border-2 border-dashed border-zinc-700 rounded-xl bg-zinc-800/40 hover:border-indigo-500 cursor-pointer transition-colors px-6 py-12 text-zinc-400">
          <svg class="w-10 h-10 text-zinc-400" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75V16.5m-13.5-9L12 3m0 0 4.5 4.5M12 3v13.5" />
          </svg>
          <p class="text-sm text-zinc-300 text-center">Drop a receipt photo here or click to choose</p>
          <p class="text-xs text-zinc-500">JPEG, PNG, WebP, HEIC — max 5 MB</p>
          <input type="file" id="file-input" accept="image/*" class="hidden" />
        </div>

        <!-- Preview area (hidden until file selected) -->
        <div id="preview" style="display:none" class="mt-6 flex flex-col items-center gap-4">
          <img id="preview-img" src="" alt="Receipt preview"
               class="max-h-48 rounded-lg border border-zinc-700 shadow-sm object-contain" />
          <div class="flex items-center gap-4">
            <button id="scan-btn"
                    class="bg-indigo-500 hover:bg-indigo-600 disabled:opacity-40 text-white text-sm font-semibold rounded-xl px-6 py-2 transition-colors">
              Scan Receipt
            </button>
            <button id="reset-btn" class="text-sm text-zinc-400 hover:text-white underline">
              Choose different photo
            </button>
          </div>
        </div>

        <!-- Result form (hidden until scan completes) -->
        <div id="result-form" style="display:none" class="mt-6">
          <h2 class="text-sm font-semibold text-zinc-300 mb-4">Review &amp; edit before saving</h2>
          <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">

            <div>
              <label for="result-amount" class="block text-zinc-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Amount ($)</label>
              <input type="number" id="result-amount" step="0.01" min="0"
                     class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-white text-sm placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
            </div>

            <div>
              <label for="result-merchant" class="block text-zinc-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Merchant</label>
              <input type="text" id="result-merchant"
                     class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-white text-sm placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
            </div>

            <div>
              <label for="result-date" class="block text-zinc-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Date</label>
              <input type="date" id="result-date"
                     class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-white text-sm placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
            </div>

            <div>
              <label for="result-category" class="block text-zinc-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Category</label>
              <select id="result-category"
                      class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-white text-sm focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors">
                <option value="Food">Food</option>
                <option value="Groceries">Groceries</option>
                <option value="Coffee">Coffee</option>
                <option value="Transportation">Transportation</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Subscriptions">Subscriptions</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="sm:col-span-2">
              <label for="result-notes" class="block text-zinc-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Notes (optional)</label>
              <input type="text" id="result-notes"
                     class="w-full bg-zinc-800 border border-zinc-700 rounded-lg px-3 py-2.5 text-white text-sm placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-colors" />
            </div>

          </div>

          <div class="flex items-center gap-4 mt-6">
            <button id="save-btn"
                    class="bg-emerald-500 hover:bg-emerald-600 disabled:opacity-40 text-white text-sm font-semibold rounded-xl px-6 py-2 transition-colors">
              Save Expense
            </button>
            <button id="rescan-btn" class="text-sm text-zinc-400 hover:text-white underline">
              Scan another
            </button>
          </div>
        </div>

        <!-- Status feedback -->
        <div id="status" style="display:none"
             class="mt-4 p-3 rounded transition-opacity duration-200 text-sm">
        </div>

      </div>
    </main>
  </div>

  <script src="/js/scanner.js"></script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
