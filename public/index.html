<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Landing</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">

  <!-- ============ DEV PREVIEW BANNER — REMOVE BEFORE DEMO ============ -->
  <div id="dev-banner" class="fixed top-2 right-2 z-50 bg-white border border-slate-300 rounded-lg shadow-lg px-3 py-2 text-xs font-mono flex items-center gap-2">
    <span id="tw-dot" class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
    <span class="text-slate-700">index.html</span>
    <span class="text-slate-400">|</span>
    <span id="boot-time" class="text-slate-500">…</span>
    <button id="ping-btn" class="ml-1 px-2 py-0.5 rounded bg-slate-900 text-white hover:bg-slate-700">ping</button>
    <span id="ping-result" class="text-slate-500">·</span>
  </div>
  <!-- ============ END DEV PREVIEW BANNER ============ -->

  <main class="p-8 pt-16">
    <h1 class="text-3xl font-bold mb-2">Spendly — Landing</h1>
    <p class="text-slate-600">Placeholder page. Landing UI will be built in later checkpoints.</p>
  </main>

  <!-- CP02 TEST UI START -->
  <div class="max-w-md mx-auto mt-8 p-6 bg-white rounded-lg shadow">
    <!-- View A: Register form (default) -->
    <div id="register-view">
      <h2 class="text-xl font-bold mb-4">Register</h2>
      <form id="register-form">
        <input type="text" name="username" placeholder="Username" class="w-full p-2 mb-2 border rounded" required>
        <input type="password" name="password" placeholder="Password" class="w-full p-2 mb-2 border rounded" required>
        <input type="email" name="email" placeholder="Email" class="w-full p-2 mb-2 border rounded" required>
        <input type="text" name="schoolName" placeholder="School Name" class="w-full p-2 mb-2 border rounded" required>
        <input type="number" name="graduationYear" placeholder="Graduation Year" min="2024" max="2035" class="w-full p-2 mb-2 border rounded" required>
        <select name="studentStatus" class="w-full p-2 mb-2 border rounded" required>
          <option value="" disabled selected>Student Status</option>
          <option value="Freshman">Freshman</option>
          <option value="Sophomore">Sophomore</option>
          <option value="Junior">Junior</option>
          <option value="Senior">Senior</option>
        </select>
        <input type="text" name="primaryFinancialGoal" placeholder="Primary Financial Goal (e.g., savings)" class="w-full p-2 mb-2 border rounded" required>
        <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded">Register</button>
      </form>
      <p class="mt-2 text-center">
        <a href="#" id="show-login" class="text-blue-500 underline">Switch to Login</a>
      </p>
    </div>

    <!-- View B: Login form -->
    <div id="login-view" style="display: none;">
      <h2 class="text-xl font-bold mb-4">Login</h2>
      <form id="login-form">
        <input type="text" name="identifier" placeholder="Username or Email" class="w-full p-2 mb-2 border rounded" required>
        <input type="password" name="password" placeholder="Password" class="w-full p-2 mb-2 border rounded" required>
        <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded">Login</button>
      </form>
      <p class="mt-2 text-center">
        <a href="#" id="show-register" class="text-blue-500 underline">Switch to Register</a>
      </p>
    </div>

    <!-- Status message -->
    <div id="status-message" style="display: none; opacity: 0; transition: opacity 0.2s ease-in-out;"></div>
  </div>

  <script>
    function showStatus(message, isError) {
      const statusDiv = document.getElementById('status-message');
      statusDiv.textContent = message;
      statusDiv.className = isError
        ? 'bg-red-50 text-red-700 p-3 rounded mt-4'
        : 'bg-green-50 text-green-700 p-3 rounded mt-4';
      statusDiv.style.display = 'block';
      setTimeout(() => {
        statusDiv.style.opacity = '0';
        setTimeout(() => {
          statusDiv.style.display = 'none';
          statusDiv.style.opacity = '';
        }, 200);
      }, 4000);
    }

    function showView(viewId) {
      document.getElementById('register-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
    }

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showView('register-view');
        }
      } catch (err) {
        showView('register-view');
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        username: formData.get('username'),
        password: formData.get('password'),
        email: formData.get('email'),
        schoolName: formData.get('schoolName'),
        graduationYear: parseInt(formData.get('graduationYear')),
        studentStatus: formData.get('studentStatus'),
        primaryFinancialGoal: formData.get('primaryFinancialGoal')
      };

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showStatus(result.error || 'Registration failed', true);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, true);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        identifier: formData.get('identifier'),
        password: formData.get('password')
      };

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showStatus(result.error || 'Login failed', true);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, true);
      }
    });

    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      showView('login-view');
    });

    document.getElementById('show-register').addEventListener('click', (e) => {
      e.preventDefault();
      showView('register-view');
    });

    document.addEventListener('DOMContentLoaded', checkAuth);
  </script>
  <!-- CP02 TEST UI END -->

  <script>
    (async () => {
      try {
        const res = await fetch('/api/health');
        const data = await res.json();
        document.getElementById('boot-time').textContent = 'boot ' + new Date(data.startedAt).toLocaleTimeString();
      } catch (e) {
        document.getElementById('boot-time').textContent = 'boot ?';
      }
      document.getElementById('ping-btn').addEventListener('click', async () => {
        const el = document.getElementById('ping-result');
        el.textContent = '…';
        try {
          const r = await fetch('/api/health');
          el.textContent = r.ok ? '✅' : '❌';
        } catch {
          el.textContent = '❌';
        }
      });
    })();
  </script>
</body>
</html>
