<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Landing</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">

    <!-- Brand -->
    <div class="flex flex-col items-center mb-6">
      <div class="w-12 h-12 rounded-xl bg-blue-600 flex items-center justify-center mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Spendly</h1>
      <p class="text-slate-400 text-sm">your money's smarter friend</p>
    </div>

    <!-- Auth card -->
    <div class="bg-slate-800 rounded-2xl p-6 border border-slate-700">
      <!-- View A: Register form (default) -->
      <div id="register-view">
        <h2 class="text-xl font-bold mb-4 text-white">Register</h2>
        <form id="register-form">
          <input type="text" name="username" placeholder="Username" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <input type="password" name="password" placeholder="Password" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <input type="email" name="email" placeholder="Email" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <input type="text" name="schoolName" placeholder="School Name" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <input type="number" name="graduationYear" placeholder="Graduation Year" min="2024" max="2035" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <select name="studentStatus" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
            <option value="" disabled selected>Student Status</option>
            <option value="Freshman">Freshman</option>
            <option value="Sophomore">Sophomore</option>
            <option value="Junior">Junior</option>
            <option value="Senior">Senior</option>
          </select>
          <input type="text" name="primaryFinancialGoal" placeholder="Primary Financial Goal (e.g., savings)" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <label id="admin-code-label" for="admin-code" class="block text-indigo-400 text-sm font-medium mb-1.5" style="display:none">🔐 Super Duper Secret Admin Mode</label>
          <input type="password" id="admin-code" name="adminCode" placeholder="Admin Code" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" style="display:none">
          <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg py-2.5 text-sm transition-colors">Register</button>
        </form>
        <p class="mt-3 text-center text-sm text-slate-400">
          <a href="#" id="show-login" class="text-indigo-400 hover:text-indigo-300 underline">Switch to Login</a>
        </p>
      </div>

      <!-- View B: Login form -->
      <div id="login-view" style="display: none;">
        <h2 class="text-xl font-bold mb-4 text-white">Login</h2>
        <form id="login-form">
          <input type="text" name="identifier" placeholder="Username or Email" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <input type="password" name="password" placeholder="Password" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2.5 mb-3 text-white text-sm placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" required>
          <button type="submit" class="w-full bg-indigo-500 hover:bg-indigo-600 text-white font-semibold rounded-lg py-2.5 text-sm transition-colors">Login</button>
        </form>
        <p class="mt-3 text-center text-sm text-slate-400">
          <a href="#" id="show-register" class="text-indigo-400 hover:text-indigo-300 underline">Switch to Register</a>
        </p>
      </div>

      <!-- Status message -->
      <div id="status-message" style="display: none; opacity: 0; transition: opacity 0.2s ease-in-out;"></div>
    </div>
  </div>

  <script>
    function showStatus(message, isError) {
      const statusDiv = document.getElementById('status-message');
      statusDiv.textContent = message;
      statusDiv.className = isError
        ? 'bg-red-900 text-red-200 p-3 rounded-lg mt-4 text-sm'
        : 'bg-green-900 text-green-200 p-3 rounded-lg mt-4 text-sm';
      statusDiv.style.display = 'block';
      setTimeout(() => {
        statusDiv.style.opacity = '0';
        setTimeout(() => {
          statusDiv.style.display = 'none';
          statusDiv.style.opacity = '';
        }, 200);
      }, 4000);
    }

    function showView(viewId) {
      document.getElementById('register-view').style.display = 'none';
      document.getElementById('login-view').style.display = 'none';
      document.getElementById(viewId).style.display = 'block';
    }

    async function checkAuth() {
      try {
        const response = await fetch('/api/auth/me');
        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showView('register-view');
        }
      } catch (err) {
        showView('register-view');
      }
    }

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        username: formData.get('username'),
        password: formData.get('password'),
        email: formData.get('email'),
        schoolName: formData.get('schoolName'),
        graduationYear: parseInt(formData.get('graduationYear')),
        studentStatus: formData.get('studentStatus'),
        primaryFinancialGoal: formData.get('primaryFinancialGoal'),
        adminCode: formData.get('adminCode') || ''
      };

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showStatus(result.error || 'Registration failed', true);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, true);
      }
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = {
        identifier: formData.get('identifier'),
        password: formData.get('password')
      };

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        if (response.ok) {
          window.location.href = 'dashboard.html';
        } else {
          showStatus(result.error || 'Login failed', true);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, true);
      }
    });

    document.getElementById('show-login').addEventListener('click', (e) => {
      e.preventDefault();
      showView('login-view');
    });

    document.getElementById('show-register').addEventListener('click', (e) => {
      e.preventDefault();
      showView('register-view');
    });

    document.addEventListener('DOMContentLoaded', checkAuth);

    // Secret keystroke: type "spend" anywhere to reveal the admin code field.
    const SECRET = ['s', 'p', 'e', 'n', 'd'];
    let keyBuffer = [];
    document.addEventListener('keydown', (e) => {
      keyBuffer.push(e.key.toLowerCase());
      if (keyBuffer.length > 5) keyBuffer.shift();
      if (keyBuffer.join('') === SECRET.join('')) {
        const label = document.getElementById('admin-code-label');
        const field = document.getElementById('admin-code');
        if (label) label.style.display = 'block';
        if (field) field.style.display = 'block';
        keyBuffer = [];
      }
    });
  </script>
</body>
</html>
