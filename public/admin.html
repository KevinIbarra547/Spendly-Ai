<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="min-h-screen flex" style="background:var(--bg-base);color:var(--fg1)">

  <div id="sidebar-container"></div>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-zinc-950">
    <main class="p-8 pt-10 max-w-2xl">

      <!-- Header -->
      <div class="mb-6">
        <h1 class="text-2xl font-bold text-white flex items-center">
          Admin Dashboard
          <span class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full ml-2">GOD MODE</span>
        </h1>
        <p class="text-zinc-400 text-sm mt-1">Restricted access — admin only</p>
      </div>

      <div class="bg-zinc-900 rounded-2xl p-6 border border-zinc-800">

        <!-- Feature toggles -->
        <h2 class="text-xs uppercase tracking-wide text-zinc-500 mb-3">Feature Toggles</h2>

        <!-- AI Coach toggle -->
        <div class="flex items-center justify-between py-3 border-b border-zinc-800">
          <div>
            <span class="text-white text-sm font-medium">AI Coach Enabled</span>
            <p class="text-zinc-500 text-xs">Groq chat for personalized advice</p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
            <input type="checkbox" id="toggle-coach" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-zinc-700 rounded-full peer peer-checked:bg-indigo-500 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div>
          </label>
        </div>

        <!-- Receipt Scanner toggle -->
        <div class="flex items-center justify-between py-3 border-b border-zinc-800">
          <div>
            <span class="text-white text-sm font-medium">Receipt Scanner Enabled</span>
            <p class="text-zinc-500 text-xs">AI vision for receipt parsing</p>
          </div>
          <label class="relative inline-flex items-center cursor-pointer flex-shrink-0">
            <input type="checkbox" id="toggle-scanner" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-zinc-700 rounded-full peer peer-checked:bg-indigo-500 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div>
          </label>
        </div>

        <!-- Message of the Day -->
        <div class="pt-5">
          <h2 class="text-xs uppercase tracking-wide text-zinc-500 mb-3">Message of the Day</h2>
          <textarea id="motd-input" rows="3"
                    class="w-full bg-zinc-800 border border-zinc-700 rounded-lg text-white placeholder-zinc-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 px-3 py-2.5 text-sm"></textarea>
          <div class="mt-4 flex items-center justify-end gap-3">
            <span id="motd-status" class="text-green-400 text-sm" style="display:none;"></span>
            <button id="save-motd" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Save</button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="/js/admin.js"></script>
  <script src="/js/sidebar.js"></script>
</body>
</html>
