<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-950 text-white min-h-screen flex">

  <div id="sidebar-container"></div>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-slate-950">
    <main class="p-8 pt-10 max-w-2xl">

      <h1 class="text-2xl font-bold text-white mb-6 flex items-center">
        Admin Dashboard
        <span class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full ml-2">God Mode</span>
      </h1>

      <div class="bg-slate-800 rounded-2xl p-6">

        <!-- AI Coach toggle -->
        <div class="flex items-center justify-between py-3 border-b border-slate-700">
          <span class="text-white text-sm font-medium">AI Coach Enabled</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggle-coach" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-600 rounded-full peer peer-checked:bg-indigo-500 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div>
          </label>
        </div>

        <!-- Receipt Scanner toggle -->
        <div class="flex items-center justify-between py-3 border-b border-slate-700">
          <span class="text-white text-sm font-medium">Receipt Scanner Enabled</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggle-scanner" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-600 rounded-full peer peer-checked:bg-indigo-500 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div>
          </label>
        </div>

        <!-- Message of the Day -->
        <div class="pt-5">
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Message of the Day</label>
          <textarea id="motd-input" rows="3"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm"></textarea>
          <div class="mt-4 flex items-center justify-end gap-3">
            <span id="motd-status" class="text-green-400 text-sm" style="display:none;"></span>
            <button id="save-motd" class="bg-green-600 hover:bg-green-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Save</button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="/js/admin.js"></script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/admin-nav.js"></script>
</body>
</html>
