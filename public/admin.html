<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-950 text-white min-h-screen flex">

  <!-- Sidebar -->
  <aside class="fixed top-0 left-0 h-screen w-64 bg-slate-900 flex flex-col border-r border-slate-800 z-40">

    <!-- Brand -->
    <div class="px-5 py-6 border-b border-slate-800">
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 flex items-center justify-center flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v12m-3-2.818.879.659c1.171.879 3.07.879 4.242 0 1.172-.879 1.172-2.303 0-3.182C13.536 12.219 12.768 12 12 12c-.725 0-1.45-.22-2.003-.659-1.106-.879-1.106-2.303 0-3.182s2.9-.879 4.006 0l.415.33M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" />
          </svg>
        </div>
        <div>
          <div class="text-white font-bold text-lg leading-tight">Spendly</div>
          <div class="text-slate-400 text-xs leading-tight">your money's smarter friend</div>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">

      <a href="dashboard.html" data-page="dashboard.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
        </svg>
        <span class="text-sm font-medium">User Dashboard</span>
      </a>

      <a href="expenses.html" data-page="expenses.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 18.75a60.07 60.07 0 0 1 15.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 0 1 3 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 0 0-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 0 1-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 0 0 3 15h-.75M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm3 0h.008v.008H18V10.5Zm-12 0h.008v.008H6V10.5Z" />
        </svg>
        <span class="text-sm font-medium">Expense Log</span>
      </a>

      <a href="goals.html" data-page="goals.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />
        </svg>
        <span class="text-sm font-medium">Goals / Wishlist</span>
      </a>

      <a href="coach.html" data-page="coach.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M20.25 8.511c.884.284 1.5 1.128 1.5 2.097v4.286c0 1.136-.847 2.1-1.98 2.193-.34.027-.68.052-1.02.072v3.091l-3-3c-1.354 0-2.694-.055-4.02-.163a2.115 2.115 0 0 1-.825-.242m9.345-8.334a2.126 2.126 0 0 0-.476-.095 48.64 48.64 0 0 0-8.048 0c-1.131.094-1.976 1.057-1.976 2.192v4.286c0 .837.46 1.58 1.155 1.951m9.345-8.334V6.637c0-1.621-1.152-3.026-2.76-3.235A48.455 48.455 0 0 0 11.25 3c-2.115 0-4.198.137-6.24.402-1.608.209-2.76 1.614-2.76 3.235v6.226c0 1.621 1.152 3.026 2.76 3.235.577.075 1.157.14 1.74.194V20.25a.75.75 0 0 0 1.28.53l4.184-4.183a.39.39 0 0 1 .402-.088A48.35 48.35 0 0 0 11.25 17c2.115 0 4.198-.137 6.24-.402 1.608-.209 2.76-1.614 2.76-3.235V8.511Z" />
        </svg>
        <span class="text-sm font-medium">AI Coach</span>
      </a>

      <a href="analytics.html" data-page="analytics.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        <span class="text-sm font-medium">Analytics</span>
      </a>

      <a href="profile.html" data-page="profile.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
        <span class="text-sm font-medium">Profile Settings</span>
      </a>

      <a href="admin.html" id="admin-nav-link" data-page="admin.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
        </svg>
        <span class="text-sm font-medium">Admin Dashboard</span>
      </a>

    </nav>

    <!-- User info -->
    <div class="px-4 py-4 border-t border-slate-800">
      <div class="flex items-center gap-3">
        <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 overflow-hidden">
          <span id="sidebar-initials"></span>
        </div>
        <div class="min-w-0">
          <span id="sidebar-username" class="text-sm text-white font-medium block truncate">Loading...</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-slate-950">
    <main class="p-8 pt-10 max-w-2xl">

      <h1 class="text-2xl font-bold text-white mb-6 flex items-center">
        Admin Dashboard
        <span class="bg-red-600 text-white text-xs px-2 py-0.5 rounded-full ml-2">God Mode</span>
      </h1>

      <div class="bg-slate-800 rounded-2xl p-6">

        <!-- AI Coach toggle -->
        <div class="flex items-center justify-between py-3 border-b border-slate-700">
          <span class="text-white text-sm font-medium">AI Coach Enabled</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggle-coach" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-600 rounded-full peer peer-checked:bg-indigo-500 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div>
          </label>
        </div>

        <!-- Receipt Scanner toggle -->
        <div class="flex items-center justify-between py-3 border-b border-slate-700">
          <span class="text-white text-sm font-medium">Receipt Scanner Enabled</span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggle-scanner" class="sr-only peer" checked>
            <div class="w-11 h-6 bg-slate-600 rounded-full peer peer-checked:bg-indigo-500 transition-colors after:content-[''] after:absolute after:top-0.5 after:left-0.5 after:bg-white after:rounded-full after:h-5 after:w-5 after:transition-transform peer-checked:after:translate-x-5"></div>
          </label>
        </div>

        <!-- Message of the Day -->
        <div class="pt-5">
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Message of the Day</label>
          <textarea id="motd-input" rows="3"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm"></textarea>
          <div class="mt-4 flex items-center justify-end gap-3">
            <span id="motd-status" class="text-green-400 text-sm" style="display:none;"></span>
            <button id="save-motd" class="bg-green-600 hover:bg-green-500 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Save</button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script src="/js/admin.js"></script>
  <script>
    (async () => {
      try {
        const res = await fetch('/api/auth/me', { credentials: 'include' });
        if (res.ok) {
          const user = await res.json();
          document.getElementById('sidebar-username').textContent = user.username;
          const isDefaultPfp = !user.pfp || user.pfp === '/uploads/pfps/default.png';
          if (!isDefaultPfp) {
            document.getElementById('sidebar-avatar').innerHTML = `<img src="${user.pfp}" class="w-full h-full object-cover" alt="">`;
          } else {
            document.getElementById('sidebar-initials').textContent = user.username.slice(0, 2).toUpperCase();
          }
        }
      } catch (e) { /* ignore */ }
    })();

    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.dataset.page === currentPage) {
        link.classList.add('bg-indigo-600', 'text-white');
        link.classList.remove('text-slate-400', 'hover:bg-slate-800');
      }
    });
  </script>
  <script src="/js/admin-nav.js"></script>
</body>
</html>
