<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Checkpoints</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-slate-950 text-white min-h-screen flex">

  <div id="sidebar-container"></div>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-slate-950">
    <main class="p-8 pt-10 max-w-3xl">

      <h1 class="text-2xl font-bold text-white mb-1">Project Checkpoints</h1>
      <p class="text-slate-400 mb-8">Spendly development milestones</p>

      <div id="checkpoint-list"></div>

    </main>
  </div>

  <script>
    const checkpoints = [
      { cp: 'CP01', name: 'Project Setup & Tooling', owner: 'TBD' },
      { cp: 'CP02', name: 'Authentication & Sessions', owner: 'TBD' },
      { cp: 'CP03', name: 'User Profiles', owner: 'TBD' },
      { cp: 'CP04', name: 'Expenses & Goals API', owner: 'TBD' },
      { cp: 'CP05', name: 'UI Shell & Navigation', owner: 'TBD' },
      { cp: 'CP06', name: 'Dashboard & Charts', owner: 'TBD' },
      { cp: 'CP07', name: 'AI Coach', owner: 'TBD' },
      { cp: 'CP08', name: 'Receipt Scanner', owner: 'TBD' },
      { cp: 'CP09', name: 'Admin Controls', owner: 'TBD' },
      { cp: 'CP10', name: 'Analytics', owner: 'TBD' },
      { cp: 'CP11', name: 'Polish & Testing', owner: 'TBD' },
      { cp: 'CP12', name: 'Deployment', owner: 'TBD' },
    ];

    document.getElementById('checkpoint-list').innerHTML = checkpoints.map((c) => `
      <div class="bg-slate-800 rounded-2xl p-5 mb-4 flex items-start gap-4">
        <span class="bg-indigo-600 text-white text-xs font-bold px-2 py-1 rounded-lg w-12 text-center flex-shrink-0">${c.cp}</span>
        <div class="min-w-0">
          <div class="text-white font-semibold">${c.name}</div>
          <div class="text-indigo-400 text-sm">${c.owner}</div>
          <div class="text-slate-500 text-xs mt-1">Date: TBD</div>
          <div class="text-slate-400 text-sm mt-1">Reflection: TBD</div>
        </div>
      </div>
    `).join('');
  </script>
  <script src="/js/sidebar.js"></script>
  <script src="/js/admin-nav.js"></script>
</body>
</html>
