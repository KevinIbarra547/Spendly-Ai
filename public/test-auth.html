<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spendly — Auth Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    .status-message {
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    .status-message.show {
      opacity: 1;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <div class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white p-6 rounded-lg shadow-xl w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4" id="auth-title">Auth Test</h2>

      <!-- Register Form -->
      <div id="register-form" style="display: none;">
        <form id="register-form-element">
          <input type="text" name="username" placeholder="Username" class="w-full p-2 mb-2 border rounded" required>
          <input type="password" name="password" placeholder="Password" class="w-full p-2 mb-2 border rounded" required>
          <input type="email" name="email" placeholder="Email" class="w-full p-2 mb-2 border rounded" required>
          <input type="text" name="schoolName" placeholder="School Name" class="w-full p-2 mb-2 border rounded" required>
          <input type="number" name="graduationYear" placeholder="Graduation Year" class="w-full p-2 mb-2 border rounded" required>
          <input type="text" name="studentStatus" placeholder="Student Status" class="w-full p-2 mb-2 border rounded" required>
          <input type="text" name="primaryFinancialGoal" placeholder="Primary Financial Goal" class="w-full p-2 mb-2 border rounded" required>
          <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded hover:bg-blue-600">Register</button>
        </form>
        <button onclick="showLogin()" class="mt-2 w-full p-2 bg-gray-200 rounded hover:bg-gray-300">Switch to Login</button>
      </div>

      <!-- Login Form -->
      <div id="login-form">
        <form id="login-form-element">
          <input type="text" name="identifier" placeholder="Username or Email" class="w-full p-2 mb-2 border rounded" required>
          <input type="password" name="password" placeholder="Password" class="w-full p-2 mb-2 border rounded" required>
          <button type="submit" class="w-full p-2 bg-blue-500 text-white rounded hover:bg-blue-600">Login</button>
        </form>
        <button onclick="showRegister()" class="mt-2 w-full p-2 bg-gray-200 rounded hover:bg-gray-300">Switch to Register</button>
      </div>

      <!-- Logout Button -->
      <div id="logout-section" style="display: none;">
        <p class="mb-4">You are logged in!</p>
        <button onclick="logout()" class="w-full p-2 bg-red-500 text-white rounded hover:bg-red-600">Logout</button>
      </div>

      <!-- Status Message -->
      <div id="status-message" class="status-message mt-4 p-3 rounded hidden"></div>

      <button onclick="closeAuth()" class="mt-4 w-full p-2 bg-gray-100 rounded hover:bg-gray-200">Close</button>
    </div>
  </div>

  <script>
    const statusMessage = document.getElementById('status-message');

    function showStatus(message, isSuccess) {
      statusMessage.textContent = message;
      statusMessage.className = 'status-message mt-4 p-3 rounded';
      if (isSuccess) {
        statusMessage.classList.add('bg-green-50', 'text-green-700');
      } else {
        statusMessage.classList.add('bg-red-50', 'text-red-700');
      }
      statusMessage.classList.add('show');
      
      setTimeout(() => {
        statusMessage.classList.remove('show');
      }, 4000);
    }

    function showRegister() {
      document.getElementById('register-form').style.display = 'block';
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('logout-section').style.display = 'none';
      document.getElementById('auth-title').textContent = 'Register';
    }

    function showLogin() {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('logout-section').style.display = 'none';
      document.getElementById('auth-title').textContent = 'Login';
    }

    function showLogout() {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('logout-section').style.display = 'block';
      document.getElementById('auth-title').textContent = 'Logout';
    }

    function closeAuth() {
      document.getElementById('auth-overlay').style.display = 'none';
    }

    document.getElementById('register-form-element').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const data = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        if (response.ok) {
          showStatus('Registration successful!', true);
          showLogin();
        } else {
          showStatus(result.error || 'Registration failed', false);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, false);
      }
    });

    document.getElementById('login-form-element').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const { identifier, password } = Object.fromEntries(formData.entries());

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ identifier, password })
        });
        const result = await response.json();
        if (response.ok) {
          showStatus('Login successful!', true);
          showLogout();
        } else {
          showStatus(result.error || 'Login failed', false);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, false);
      }
    });

    async function logout() {
      try {
        const response = await fetch('/api/auth/logout', { method: 'POST' });
        const result = await response.json();
        if (response.ok) {
          showStatus('Logged out successfully!', true);
          showLogin();
        } else {
          showStatus(result.error || 'Logout failed', false);
        }
      } catch (err) {
        showStatus('Error: ' + err.message, false);
      }
    }

    // Show login form by default
    showLogin();
  </script>
</body>
</html>
