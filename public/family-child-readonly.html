<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Child Dashboard (Read-only)</title>
  <link rel="stylesheet" href="/css/style.css" />
  <style>
    html, body {
      background: var(--bg-base);
      color: var(--fg1);
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
    }
    .wrap {
      max-width: 480px;
      margin: 0 auto;
    }
    .stack > * + * { margin-top: 16px; }
    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .child-head {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }
    .alloc-bar {
      display: flex;
      height: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: var(--bg-elevated);
    }
    .alloc-key {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--fg3);
      margin-top: 4px;
    }
    .grade-circle {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 800;
      flex-shrink: 0;
    }
    .empty {
      color: var(--fg3);
      font-size: 13px;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div id="loading" class="empty">Loading…</div>
    <div id="error" class="empty" style="display:none"></div>
    <div id="content" class="stack" style="display:none"></div>
  </div>

  <script>
    (async function () {
      const loadingEl = document.getElementById('loading');
      const errorEl   = document.getElementById('error');
      const contentEl = document.getElementById('content');

      function showError(msg) {
        loadingEl.style.display = 'none';
        errorEl.style.display   = 'block';
        errorEl.textContent     = msg;
      }

      function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, c =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      function fmt(n) { return '$' + Number(n || 0).toFixed(2); }

      const childId = new URLSearchParams(window.location.search).get('childId');
      if (!childId) { showError('No childId provided.'); return; }

      let children;
      try {
        // /api/family/members is the parent-accessible endpoint that returns
        // every linked child. (The spec mentioned /api/family/dashboard, but
        // that route is child-only — a parent calling it gets 403.)
        const res = await fetch('/api/family/members', { credentials: 'include' });
        if (!res.ok) {
          showError(res.status === 401 ? 'Please log in.' : 'Could not load family data.');
          return;
        }
        children = await res.json();
      } catch (e) {
        showError('Network error.');
        return;
      }

      const child = Array.isArray(children) && children.find(c => c.id === childId);
      if (!child) { showError('Child not found in your family group.'); return; }

      // ── Derive display values from the /members shape ────────────────────
      const alloc = child.allocations || { savingsGoal: 0, food: 0, freeSpending: 0 };
      const total = (alloc.savingsGoal || 0) + (alloc.food || 0) + (alloc.freeSpending || 0);
      const savePct  = total > 0 ? Math.round((alloc.savingsGoal  || 0) / total * 100) : 0;
      const spendPct = total > 0 ? Math.round((alloc.food         || 0) / total * 100) : 0;
      const givePct  = total > 0 ? Math.round((alloc.freeSpending || 0) / total * 100) : 0;

      const grade = child.recentGrade;
      const gradeColor = { A:'#4ade80', B:'#60a5fa', C:'#fbbf24', D:'#f87171', F:'#f87171' }[grade];
      const gradeBg    = {
        A:'rgba(34,197,94,0.15)', B:'rgba(59,130,246,0.15)',
        C:'rgba(245,158,11,0.15)', D:'rgba(239,68,68,0.15)', F:'rgba(239,68,68,0.15)'
      }[grade];
      // The /members endpoint doesn't expose gradeFeedback (it lives on per-
      // allowance entries in allowanceHistory, which the summary doesn't ship).
      // Showing a short generic blurb keeps the read-only view informative.
      const gradeBlurb = {
        A: 'Excellent balance — strong saver, generous giver.',
        B: 'Good habits forming.',
        C: 'Developing financial awareness.',
        D: 'Could use more balance — try saving a little more.',
        F: 'Time to rethink — almost everything went to spending.'
      }[grade];

      const goal = child.savingsGoals && child.savingsGoals[0];
      const goalPct = goal
        ? Math.min(100, Math.round((Number(goal.currentSaved) / Number(goal.targetAmount)) * 100))
        : 0;

      const hasPending = (child.pendingAllowance || 0) > 0;
      const initials   = (child.username || '?').slice(0, 2).toUpperCase();

      // ── Render ───────────────────────────────────────────────────────────
      const html = [];

      // Identity card
      html.push(`
        <div class="card">
          <div class="child-head">
            <div class="avatar">${escapeHtml(initials)}</div>
            <div>
              <div class="t-h2" style="margin:0">${escapeHtml(child.username || 'Child')}</div>
              <div class="t-meta" style="margin-top:2px">Read-only view</div>
            </div>
          </div>
        </div>
      `);

      // Pending allowance
      if (hasPending) {
        html.push(`
          <div class="note-amber">
            Pending allowance: <strong>${fmt(child.pendingAllowance)}</strong>
            — not yet allocated.
          </div>
        `);
      }

      // Allocation breakdown
      html.push(`
        <div class="card">
          <div class="row-between" style="margin-bottom:10px">
            <span class="t-label">Allocation</span>
            ${grade
              ? `<span class="badge" style="background:${gradeBg};color:${gradeColor};font-weight:700">
                  Grade ${escapeHtml(grade)}
                 </span>`
              : `<span class="badge badge-gray">No grade yet</span>`
            }
          </div>
          ${total > 0
            ? `<div class="alloc-bar">
                 <div style="width:${savePct}%;background:#22c55e"></div>
                 <div style="width:${spendPct}%;background:#6366f1"></div>
                 <div style="width:${givePct}%;background:#a855f7"></div>
               </div>
               <div class="alloc-key">
                 <span>Save ${savePct}%</span>
                 <span>Food ${spendPct}%</span>
                 <span>Free ${givePct}%</span>
               </div>`
            : `<div class="t-meta">No allocation yet.</div>`
          }
        </div>
      `);

      // Grade card (only if we have a grade)
      if (grade) {
        html.push(`
          <div class="card">
            <div style="display:flex;align-items:center;gap:14px">
              <div class="grade-circle" style="background:${gradeBg};color:${gradeColor}">
                ${escapeHtml(grade)}
              </div>
              <div class="t-body" style="margin:0">${escapeHtml(gradeBlurb)}</div>
            </div>
          </div>
        `);
      }

      // Savings goal card (only if exists)
      if (goal) {
        html.push(`
          <div class="card">
            <div class="row-between" style="margin-bottom:6px">
              <span class="t-label">Savings goal</span>
              <span class="t-meta">${goalPct}%</span>
            </div>
            <div style="font-size:14px;font-weight:600;color:var(--fg1);margin-bottom:8px">
              ${escapeHtml(goal.title)}
            </div>
            <div class="progress-track">
              <div class="progress-fill-green" style="width:${goalPct}%"></div>
            </div>
            <div class="t-meta" style="margin-top:6px">
              ${fmt(goal.currentSaved)} of ${fmt(goal.targetAmount)}
            </div>
          </div>
        `);
      }

      // Parent note (if exists)
      if (child.familyNotes && child.familyNotes.message) {
        html.push(`
          <div class="card">
            <div class="t-label" style="margin-bottom:6px">Your note</div>
            <div class="t-body" style="margin:0">${escapeHtml(child.familyNotes.message)}</div>
          </div>
        `);
      }

      contentEl.innerHTML  = html.join('');
      loadingEl.style.display = 'none';
      contentEl.style.display = 'block';
    })();
  </script>
</body>
</html>
