        <div>

        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">

      <a href="index.html" data-page="index.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">

        <span class="text-sm font-medium">Expense Log</span>

      <a href="goals.html" data-page="goals.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z" />

      <a href="coach.html" data-page="coach.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">

        </svg>
        <span class="text-sm font-medium">AI Coach</span>

      <a href="analytics.html" data-page="analytics.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z" />
        </svg>
        <span class="text-sm font-medium">Analytics</span>
      </a>

      <a href="profile.html" data-page="profile.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">

        </svg>
        <span class="text-sm font-medium">Profile Settings</span>
      </a>

      <a href="admin.html" id="admin-nav-link" data-page="admin.html" class="nav-link flex items-center gap-3 px-3 py-2.5 rounded-full text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z" />
        </svg>
        <span class="text-sm font-medium">Admin Dashboard</span>
      </a>

    </nav>

    <!-- User info -->
    <div class="px-4 py-4 border-t border-slate-800">
      <div class="flex items-center gap-3">
        <div id="sidebar-avatar" class="w-9 h-9 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold flex-shrink-0 overflow-hidden">
          <span id="sidebar-initials"></span>
        </div>
        <div class="min-w-0">
          <span id="sidebar-username" class="text-sm text-white font-medium block truncate">Loading...</span>
        </div>
      </div>
    </div>

  </aside>

  <!-- Main content -->
  <div class="ml-64 flex-1 min-h-screen bg-slate-950">
    <main class="p-8 pt-10">

      <!-- Header -->
      <div class="flex items-center justify-between mb-6">
        <h1 class="text-2xl font-bold text-white">Expense Log</h1>
        <button id="add-expense-btn" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">
          Add Expense
        </button>
      </div>

      <!-- Error banner -->
      <div id="error-banner" class="hidden bg-red-900 text-red-200 rounded-lg p-3 mb-4 text-sm"></div>

      <!-- Filter row -->
      <div class="flex flex-col sm:flex-row gap-3 mb-6">
        <input type="text" id="search-input" placeholder="Search by merchant or notes…"
               class="flex-1 bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm" />
        <select id="category-filter"
                class="bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm sm:w-56">
          <option value="">All Categories</option>
          <option value="Food">Food</option>
          <option value="Transport">Transport</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Shopping">Shopping</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Expense list -->
      <div id="expense-list"></div>

    </main>
  </div>

  <!-- Add / Edit Expense Modal -->
  <div id="expense-modal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center z-50">
    <div class="bg-slate-800 rounded-2xl p-6 w-full max-w-md">
      <h2 id="modal-title" class="text-white font-bold text-lg mb-4">Add Expense</h2>
      <form id="expense-form" class="space-y-4">
        <input type="hidden" id="expense-id" />

        <div>
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Amount</label>
          <input type="number" id="field-amount" step="0.01" min="0" required
                 class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm" />
        </div>

        <div>
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Merchant</label>
          <input type="text" id="field-merchant" required
                 class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm" />
        </div>

        <div>
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Date</label>
          <input type="date" id="field-date" required
                 class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm" />
        </div>

        <div>
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Category</label>
          <select id="field-category"
                  class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm">
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Shopping">Shopping</option>
            <option value="Health">Health</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div>
          <label class="block text-slate-400 text-xs font-medium mb-1.5 uppercase tracking-wide">Notes</label>
          <textarea id="field-notes" rows="2"
                    class="w-full bg-slate-700 border border-slate-600 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 px-3 py-2.5 text-sm"></textarea>
        </div>

        <div class="flex justify-end gap-3 pt-2">
          <button type="button" id="cancel-btn" class="bg-slate-700 hover:bg-slate-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Cancel</button>
          <button type="submit" class="bg-indigo-500 hover:bg-indigo-600 text-white text-sm font-semibold px-4 py-2 rounded-lg transition-colors">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/expenses.js"></script>
  <script>
    document.querySelectorAll('.nav-link').forEach(link => {
      if (link.dataset.page === (window.location.pathname.split('/').pop() || 'index.html')) {
        link.classList.add('bg-indigo-600', 'text-white');
        link.classList.remove('text-slate-400', 'hover:bg-slate-800');
      }
    });
  </script>
  <script src="/js/admin-nav.js"></script>
</body>
</html>
